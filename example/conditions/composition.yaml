apiVersion: apiextensions.crossplane.io/v1
kind: Composition
metadata:
  name: app-conditions
spec:
  compositeTypeRef:
    apiVersion: conditions.example.crossplane.io/v1
    kind: App
  mode: Pipeline
  pipeline:
  - step: kro-run
    functionRef:
      name: function-kro
    input:
      apiVersion: kro.fn.crossplane.io/v1alpha1
      kind: ResourceGraph
      status:
        # Each entry sets a custom condition on the App.
        conditions:
        # True once the Deployment reports it's available.
        - |-
          ${runtime.newCondition({
            type: 'DeploymentAvailable',
            status: deployment.?status.?conditions.orValue([]).exists(c, c.type == 'Available' && c.status == 'True') ? 'True' : 'False',
            reason: 'DeploymentStatus',
            message: string(deployment.?status.?availableReplicas.orValue(0)) + ' of 2 replicas available'
          })}
        # Reads the Service's cluster IP, so it's left off the App until the
        # Service exists and has one.
        - |-
          ${runtime.newCondition({
            type: 'ServiceAddressAssigned',
            status: 'True',
            reason: 'ClusterIPAssigned',
            message: 'reachable at ' + service.spec.clusterIP + ':8080'
          })}
        # Reads whether every composed resource is ready.
        - |-
          ${runtime.newCondition({
            type: 'AllResourcesReady',
            status: runtime.condition(schema, 'ResourcesReady').status,
            reason: 'ResourcesChecked',
            message: ''
          })}
      resources:
      - id: deployment
        template:
          apiVersion: apps/v1
          kind: Deployment
          metadata:
            labels:
              example.crossplane.io/app: ${schema.metadata.name}
          spec:
            replicas: 2
            selector:
              matchLabels:
                example.crossplane.io/app: ${schema.metadata.name}
            template:
              metadata:
                labels:
                  example.crossplane.io/app: ${schema.metadata.name}
              spec:
                containers:
                - name: app
                  image: ${schema.spec.image}
                  ports:
                  - containerPort: 80
        readyWhen:
        - ${deployment.status.?conditions.orValue([]).exists(c, c.type == "Available" && c.status == "True")}
      - id: service
        template:
          apiVersion: v1
          kind: Service
          metadata:
            labels:
              example.crossplane.io/app: ${schema.metadata.name}
          spec:
            selector:
              example.crossplane.io/app: ${schema.metadata.name}
            ports:
            - protocol: TCP
              port: 8080
              targetPort: 80
        readyWhen:
        - ${service.spec.?clusterIP.hasValue()}

# This pipeline has no function-auto-ready step: each resource declares its own
# readyWhen, so Crossplane marks the App ready once both the Deployment and
# Service satisfy those conditions.
